.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: "";
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed="true"],
  [aria-selected="true"],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed="true"], [aria-selected="true"], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type="file"]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type="color"] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type="date"],
    [type="datetime-local"],
    [type="month"],
    [type="time"],
    [type="week"]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: "";
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget > svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  <script>
  (()=>{

    const probe=document.createElement('span');probe.style.display='none';root.appendChild(probe);
    const colorCanvas=document.createElement('canvas');colorCanvas.width=1;colorCanvas.height=1;const colorCtx=colorCanvas.getContext('2d',{willReadFrequently:true});
    function color(name){colorCtx.clearRect(0,0,1,1);probe.style.color='var(--background)';colorCtx.fillStyle=getComputedStyle(probe).color;colorCtx.fillRect(0,0,1,1);probe.style.color=`var(${name})`;colorCtx.fillStyle=getComputedStyle(probe).color;colorCtx.fillRect(0,0,1,1);const p=colorCtx.getImageData(0,0,1,1).data;return `rgb(${p[0]},${p[1]},${p[2]})`;}
    function colors(){palette={fg:color('--foreground'),bg:color('--background'),muted:color('--muted'),border:color('--border'),boat:color('--g3-boat-color'),frame:color('--g3-frame-color'),slide:color('--viz-series-3'),cloth:color('--g3-cloth-color')};}
    function shade(c,f){const nums=c.match(/[\d.]+/g);if(!nums||nums.length<3)return c;return `rgb(${nums.slice(0,3).map(v=>Math.min(255,Math.round(Number(v)*f))).join(',')})`;}
    function verticalView(){return {lo:Math.min(facadeBottom,verticalOffset-.85),hi:Math.max(facadeTop+.10,anchorHeight+.15)};}
    function camera(p){const v=verticalView(),x=p[0]-1.5,y=p[1]-(v.lo+v.hi)/2,z=p[2]-1.0;const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);return [cy*x-sy*z,cp*y-sp*(sy*x+cy*z),sp*y+cp*(sy*x+cy*z)];}

    function shape(points,fill,stroke,lineWidth=1,alpha=1,dash=[]){points=points.map(p=>[p[0],p[1]+drawOffset,p[2]]);shapes.push({points,fill,stroke,lineWidth,alpha,dash,layer:drawLayer,worker:drawingWorker,d:points.reduce((s,p)=>s+camera(p)[2],0)/points.length});}

      const faces=[[[0,1,2,3],.82],[[4,7,6,5],1],[[0,4,5,1],.66],[[3,2,6,7],1.12],[[0,3,7,4],.9],[[1,5,6,2],.74]];

    function rod(a,b,c,r=.018){
      const v=b.map((n,i)=>n-a[i]),len=Math.hypot(...v);if(len===0)return;
      const n=v.map(n=>n/len);const ref=Math.abs(n[1])<.9?[0,1,0]:[1,0,0];
      let u=[n[1]*ref[2]-n[2]*ref[1],n[2]*ref[0]-n[0]*ref[2],n[0]*ref[1]-n[1]*ref[0]];const ul=Math.hypot(...u);u=u.map(n=>n/ul);

      distanceToggle.textContent=showDistances?'尺寸顯示：開':'尺寸顯示：關';
      distanceToggle.setAttribute('aria-pressed',String(showDistances));
      for(const id of ['g3-distance-summary','g3-distance-hint','g3-readout','g3-clearance'])root.querySelector('#'+id).hidden=!showDistances;
      render();
    });
    themeToggle.addEventListener('click',()=>{
      chosenTheme=root.dataset.g3Theme!=='dark';
      applyTheme(chosenTheme);colors();render();
    });
    systemTheme.addEventListener('change',e=>{
      if(chosenTheme===null){applyTheme(e.matches);colors();render();}
    });
    const settingsToggle=root.querySelector('#g3-settings-toggle');
    let showSizeSettings=true;
    settingsToggle.addEventListener('click',()=>{
      showSizeSettings=!showSizeSettings;
      settingsToggle.textContent=showSizeSettings?'隱藏尺寸設定':'顯示尺寸設定';
      settingsToggle.setAttribute('aria-expanded',String(showSizeSettings));
      for(const id of ['g3-ac-setting','g3-extent-setting'])root.querySelector('#'+id).hidden=!showSizeSettings;
    });
    wall.addEventListener('change',render);
    view.addEventListener('change',()=>{const p={iso:[.47,.34],under:[.47,-.48],front:[0,.05],top:[0,Math.PI/2],side:[Math.PI/2,.18]}[view.value];yaw=p[0];pitch=p[1];zoom=1;render();});
    canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);});
    canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-drag.x)*.008;pitch=Math.max(-.65,Math.min(Math.PI/2,pitch+(e.clientY-drag.y)*.008));drag={x:e.clientX,y:e.clientY};render();});
    const release=()=>{drag=null;};canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
    canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.7,Math.min(1.6,zoom*Math.exp(-e.deltaY*.001)));render();},{passive:false});
    play.addEventListener('click',()=>{
      if(playing){stop(false);return;}
      const bounds=travelBounds();if(bounds.travel<=0)return;
      playing=true;play.textContent='暫停';const from=Number(sx.value),to=lateralTarget??(from<700?bounds.max:bounds.min),start=performance.now();
      lateralTarget=to;skipButton.disabled=false;
      function tick(now){if(!playing)return;const t=Math.min(1,(now-start)/motionDuration.lateral),u=t*t*(3-2*t);sx.value=String(Math.round((from+(to-from)*u)/10)*10);update();if(t<1)anim=requestAnimationFrame(tick);else{stop();update();}}
      anim=requestAnimationFrame(tick);
    });
    new ResizeObserver(resize).observe(root.querySelector('#g3-stage'));
    new MutationObserver(()=>{colors();render();}).observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});
    document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();stopMechanism();stopHeight();}});
function comparisonClearance(s){
  const distance=v=>Number.isFinite(v)?Math.round(v*1000)+' mm':'無';
  const reasons=[];
  for(const [key,label] of [['clothHit','帆布'],['frameHit','支架'],['cableHit','吊纜'],['pipeHit','喉管'],['wallHit','牆面'],['selfHit','機構內部']])if(s[key])reasons.push(label);
  if(s.balance&&!s.balance.fits)reasons.push('配重行程');
  return `船身／人員至晾架 ${distance(s.rackDistance)}（目標 ≥150 mm）· 至側面設備 ${distance(s.acDistance)}（目標 ≥300 mm）。${s.clear?'此位置通過簡化模型條件。':'此位置不符合模型條件。'}${reasons.length?'需檢查：'+reasons.join('、')+'。':''}`;
}
function initComparisonUI(adapter){
  const q=s=>root.querySelector(s),controls=['height','x','z'].map(n=>q('#ui-'+n));
  const round=n=>String(Math.round(n));
  const updateTargets=()=>controls.forEach((el,i)=>q('#ui-'+['height','x','z'][i]+'-target').textContent=el.value);
  function refresh(){
    const s=adapter.state(),actual={height:s.pose.h*1000,x:s.pose.x,z:s.pose.z};
    const target=s.target?{height:s.target.h*1000,x:s.target.x,z:s.target.z}:actual;
    for(const name of ['height','x','z']){
      q('#ui-'+name+'-current').textContent=round(actual[name]);q('#ui-'+name).value=round(target[name]);
    }
    updateTargets();
    for(const el of [controls[1],controls[2],q('#ui-return'),q('#ui-lateral')])el.disabled=s.pending||!s.canMove;
    for(const el of [controls[0],...root.querySelectorAll('[data-height]')])el.disabled=s.pending;
    for(const el of [q('#g3-people'),q('#g3-ac'),q('#g3-extent')])el.disabled=s.pending||!s.canMove;
    for(const id of ['g3-fold','g3-mech','b-mass']){const el=q('#'+id);if(el)el.disabled=s.pending||(id==='g3-fold'&&!s.canMove);}
    if(q('#g3-mech-play'))q('#g3-mech-play').disabled=s.pending&&!s.mechanismPending;
    q('#ui-pause').disabled=!s.pending;q('#ui-skip').disabled=!s.pending;
    q('#ui-pause').textContent=s.pending&&!s.running?'繼續動畫':'暫停動畫';
    q('#ui-ac-value').textContent=ac.value;q('#ui-extent-value').textContent=extent.value;
    if(q('#ui-status').textContent!==s.message)q('#ui-status').textContent=s.message;
    q('#ui-clearance').textContent=s.clearance;q('#ui-clearance').classList.toggle('text-destructive',!s.clear);
  }
  const desired=()=>({h:Number(q('#ui-height').value)/1000,x:Number(q('#ui-x').value),z:Number(q('#ui-z').value),f:100});
  controls.forEach((el,i)=>{
    el.addEventListener('input',updateTargets);
    el.addEventListener('change',()=>{const target=desired();if(i===0){target.x=700;target.z=0;}adapter.go(target);refresh();});
  });
  root.querySelectorAll('[data-height]').forEach(el=>el.addEventListener('click',()=>{adapter.go({h:Number(el.dataset.height),x:700,z:0,f:100});refresh();}));
  q('#ui-return').addEventListener('click',()=>{adapter.go({...adapter.state().pose,x:700,z:0});refresh();});
  q('#ui-lateral').addEventListener('click',()=>{adapter.lateral();refresh();});
  q('#ui-pause').addEventListener('click',()=>{adapter.pause();refresh();});
  q('#ui-skip').addEventListener('click',()=>{adapter.skip();refresh();});
  refresh();return refresh;
}

function comparisonPose(){return {x:Number(sx.value),z:Number(sz.value),h:verticalOffset,f:Number(fold.value)};}
function comparisonAssign(p){sx.min='300';sx.max='1100';sz.min='0';sz.max='900';sx.value=String(p.x);sz.value=String(p.z);}
function comparisonLerp(a,b,t){return {...a,x:a.x+(b.x-a.x)*t,z:a.z+(b.z-a.z)*t};}
function comparisonGo(goal){
  if(heightPlan||heightRunning||mechRunning||playing||comparisonMotion)return;
  if(Math.abs(goal.h-verticalOffset)>.001){comparisonNotice='';chooseHeight(goal.h);startHeight();return;}
  if(Number(mech.value)>0)return;
  const start=comparisonPose(),waypoints=[start];
  if(goal.x===700&&goal.z===0)waypoints.push({...start,z:0});waypoints.push(goal);
  const path=waypoints.filter((p,i)=>i===0||p.x!==waypoints[i-1].x||p.z!==waypoints[i-1].z);
  for(let i=1;i<path.length;i++){
    const a=path[i-1],b=path[i],n=Math.ceil(Math.max(Math.abs(a.x-b.x),Math.abs(a.z-b.z))/5)||1;
    for(let j=0;j<=n;j++){const p=comparisonLerp(a,b,j/n);if(!spatialState(p.x/1000,1.2-p.z/1000).clear){comparisonNotice='目標或途經位置不符合本方案的間隙條件；目前位置保留。';update();return;}}
  }
  if(start.x===goal.x&&start.z===goal.z){comparisonNotice='已在目標位置。';update();return;}
  comparisonMotion={path,segment:0,elapsed:0,last:performance.now(),paused:false};comparisonNotice='慢速移動中；路徑已通過簡化幾何檢查。';update();comparisonRaf=requestAnimationFrame(comparisonTick);
}
function comparisonTick(now){
  const m=comparisonMotion;if(!m||m.paused)return;m.elapsed+=Math.min(100,now-m.last);m.last=now;
  const t=Math.min(1,m.elapsed/(8000/(m.path.length-1)));comparisonAssign(comparisonLerp(m.path[m.segment],m.path[m.segment+1],ease(t)));
  if(t===1){m.segment++;m.elapsed=0;if(m.segment===m.path.length-1){comparisonMotion=null;comparisonNotice='已到達幾何目標；扣接及受力仍為假設。';}}
  update();if(comparisonMotion)comparisonRaf=requestAnimationFrame(comparisonTick);
}
comparisonRefresh=initComparisonUI({
  state(){
    const s=spatialState(),pending=!!comparisonMotion||!!heightPlan||heightRunning||mechanismTarget!==null||lateralTarget!==null;
    return {pose:comparisonPose(),target:comparisonMotion?.path.at(-1)||(heightPlan?{h:heightPlan.to,x:700,z:0}:null),pending,mechanismPending:mechanismTarget!==null,running:comparisonMotion?!comparisonMotion.paused:heightRunning||mechRunning||playing,canMove:Number(mech.value)===0,
      message:heightPhaseText||(mechanismTarget!==null?root.querySelector('#g3-mech-status').textContent:comparisonNotice||root.querySelector('#g3-overlap').textContent),
      clearance:comparisonClearance(s),clear:s.clear};
  },
  go:comparisonGo,
  pause(){if(comparisonMotion){comparisonMotion.paused=!comparisonMotion.paused;if(comparisonMotion.paused)cancelAnimationFrame(comparisonRaf);else{comparisonMotion.last=performance.now();comparisonRaf=requestAnimationFrame(comparisonTick);}update();}else if(heightPlan)startHeight();else if(mechanismTarget!==null)mechPlay.click();else if(lateralTarget!==null)play.click();},
  skip(){if(comparisonMotion){comparisonAssign(comparisonMotion.path.at(-1));comparisonMotion=null;cancelAnimationFrame(comparisonRaf);comparisonNotice='已到達經檢查的目標位置。';update();}else skipButton.click();},
  lateral(){const b=travelBounds();if(b.travel>0)comparisonGo({...comparisonPose(),x:Number(sx.value)<=700?b.max:b.min});else{comparisonNotice='此位置沒有可連續橫移的空間。';update();}}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&comparisonMotion){comparisonMotion.paused=true;cancelAnimationFrame(comparisonRaf);update();}});

    applyTheme(systemTheme.matches);
    resize();update();
  })();
  </script>
</div>
