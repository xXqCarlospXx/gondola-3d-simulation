function carrierGeometry(x,z){
  const colorsByPart={frame:palette.frame,slide:palette.slide,fg:palette.fg,counter:shade(palette.fg,.75)};
  for(const p of carrierParts(x,z,0))box(...p.min,...p.max.map((v,i)=>v-p.min[i]),colorsByPart[p.color]);
  // Rear-plane diagonal bracing, included in the collision envelopes below.
  rod([.38,.20,2.36],[2.62,2.60,2.36],palette.frame,.018);
  rod([2.62,.20,2.36],[.38,2.60,2.36],palette.frame,.018);
  const b=balanceState(x,z);
  for(const yy of [-.43,-.35])line([b.cx-.37,yy,b.cz+.228],[b.cx+.37,yy,b.cz+.228],palette.border,1);
  sphere([1.5,2.80,1.575],.035,palette.slide);
}
function carrierSpatial(x,z,h){
  const obs=obstacleBoxes(),occupied=occupiedBoxes(x,z,h),e=clothExtension();
  const cloth={min:[x-e,.69+h,z-e],max:[x+1.6+e,1.15+h,z+.75+e]};
  const parts=carrierParts(x,z,h),frames=frameBoxes(x,z,h),cables=carrierCables(h),balance=balanceState(x,z);
  const acNearest=closestOccupied(occupied,obs.filter(o=>o.kind==='unit')),rackNearest=closestOccupied(occupied,obs.filter(o=>o.kind==='rack'));
  const clothHit=obs.some(o=>boxDistance(cloth,o)<.005);
  const frameHit=obs.some(o=>frames.some(p=>boxDistance(p,o)<.005));
  const cableHit=obs.some(o=>cables.some(([a,b])=>segmentHits(a,b,o)));
  const pipeHit=pipeBoxes().some(o=>[...occupied,cloth,...frames].some(p=>boxDistance(p,o)<.005)||cables.some(([a,b])=>segmentHits(a,b,o)));
  const wallHit=x-e<0||x+1.6+e>3||z-e<.005||z<.3-1e-8||frames.some(p=>p.min[0]<.005||p.max[0]>2.995||p.min[2]<.005);
  const selfHit=parts.filter(p=>p.guard).some(p=>[...occupied,cloth].some(o=>boxDistance(p,o)<.005));
  const acDistance=acNearest.distance,rackDistance=rackNearest.distance;
  return {acNearest,rackNearest,acDistance,rackDistance,clothHit,frameHit,cableHit,pipeHit,wallHit,selfHit,balance,
    clear:acDistance>=.3-1e-8&&rackDistance>=.15-1e-8&&!clothHit&&!frameHit&&!cableHit&&!pipeHit&&!wallHit&&!selfHit&&balance.fits};
}
function update(){
  const s=spatialState(),b=s.balance;
  $('#b-status').textContent=`目前高度 ${Math.round(verticalOffset*1000)} mm · 船身距左牆 ${Math.round(Number(sx.value))} mm · 向前移近 ${Math.round(Number(sz.value))} mm · 帆布／橫軌展開 ${Math.round(Number(fold.value))}%。${notice}`;
  $('#b-force').textContent=`質量假設：工作船連人及工具 ${b.workingMass} kg ＋ 承托架 ${b.frameMass} kg ＋ 配重 ${b.counterMass} kg ＝ ${b.total} kg；配重中心距左牆 ${Math.round(b.cx*1000)} mm／距前牆 ${Math.round(b.cz*1000)} mm。`;
  $('#c-balance').textContent=`理想靜態合成重心：距左牆 ${Math.round(b.gx*1000)} mm／距前牆 ${Math.round(b.gz*1000)} mm；目標為 1500／1575 mm。${b.fits?'配重在假設滑台範圍內。':'配重超出滑台範圍。'}`;
  const reasons=[];
  if(s.frameHit)reasons.push('支架／配重與障礙物干涉');if(s.selfHit)reasons.push('工作船／帆布與承托架干涉');
  if(s.clothHit)reasons.push('帆布與障礙物干涉');if(s.pipeHit)reasons.push('喉管干涉');if(s.cableHit)reasons.push('吊纜干涉');if(s.wallHit)reasons.push('牆面間隙不足');if(!b.fits)reasons.push('配重行程不足');
  $('#b-clearance').textContent=`${s.clear?'此位置通過簡化幾何與重心條件':'此位置不符合模型條件'} · 人員／船身至晾架 ${Math.round(s.rackDistance*1000)} mm · 至設備 ${Number.isFinite(s.acDistance)?Math.round(s.acDistance*1000)+' mm':'無'}。${reasons.join('；')}`;
  $('#b-clearance').classList.toggle('text-destructive',!s.clear);
  $('#b-pause').disabled=!motion;$('#b-skip').disabled=!motion;$('#b-pause').textContent=paused?'繼續動畫':'暫停動畫';
  for(const id of ['b-x','b-z','b-height','b-upper','b-lower','b-return','g3-ac','g3-extent','g3-people','b-mass'])$('#'+id).disabled=!!motion;
  $('#b-ac-value').textContent=ac.value;$('#b-extent-value').textContent=extent.value;render();
}

let motion=null,raf=0,paused=false,lastTime=0,notice='';
const pose=()=>({x:Number(sx.value),z:Number(sz.value),h:verticalOffset,f:Number(fold.value)});
function assign(p){sx.value=String(p.x);sz.value=String(p.z);verticalOffset=p.h;fold.value=String(p.f);}
function poseClear(p){const saved=fold.value;fold.value=String(p.f);const s=spatialState(p.x/1000,1.2-p.z/1000,p.h);fold.value=saved;return s.clear;}
function same(a,b){return Math.abs(a.x-b.x)<.01&&Math.abs(a.z-b.z)<.01&&Math.abs(a.h-b.h)<.00001&&Math.abs(a.f-b.f)<.01;}
function interpolate(a,b,t){return {x:a.x+(b.x-a.x)*t,z:a.z+(b.z-a.z)*t,h:a.h+(b.h-a.h)*t,f:a.f+(b.f-a.f)*t};}
function planTo(goal){
  cancelAnimationFrame(raf);motion=null;paused=false;
  const start=pose(),waypoints=[start];
  if(Math.abs(goal.h-start.h)>.001){
    waypoints.push({...start,z:0},{...start,z:0,x:700},{...start,z:0,x:700,f:0},
      {x:700,z:0,h:goal.h,f:0},{x:700,z:0,h:goal.h,f:100},goal);
  }else if(goal.z===0&&goal.x===700){waypoints.push({...start,z:0},goal);}
  else waypoints.push(goal);
  const path=waypoints.filter((p,i)=>i===0||!same(p,waypoints[i-1]));
  // Validate a swept sampled path; never jump directly to a disconnected clear position.
  for(let i=1;i<path.length;i++){
    const a=path[i-1],b=path[i],n=Math.ceil(Math.max(Math.abs(a.x-b.x)/5,Math.abs(a.z-b.z)/5,Math.abs(a.h-b.h)*1000/5,Math.abs(a.f-b.f)))||1;
    for(let j=0;j<=n;j++)if(!poseClear(interpolate(a,b,j/n))){notice='目標或途經位置超出支架／配重行程，或不符合間隙條件；目前位置保留。';syncTargets();update();return;}
  }
  if(path.length<2){notice='已在目標位置。';update();return;}
  motion={path,segment:0,elapsed:0,duration:path.length>2?5000:8000};notice='工作船與配重同步反向移動；演示未含風擺。';lastTime=performance.now();update();raf=requestAnimationFrame(tick);
}
function tick(now){
  if(!motion||paused)return;
  motion.elapsed+=Math.min(now-lastTime,100);lastTime=now;
  const t=Math.min(1,motion.elapsed/motion.duration),{path,segment}=motion;
  assign(interpolate(path[segment],path[segment+1],ease(t)));
  if(t>=1){motion.segment++;motion.elapsed=0;if(motion.segment>=path.length-1){motion=null;notice='已到達幾何目標；滑台鎖止及整體防擺待驗證。';}}
  update();if(motion)raf=requestAnimationFrame(tick);
}
function syncTargets(){
  $('#b-x').value=String(Math.round(Number(sx.value)));$('#b-z').value=String(Math.round(Number(sz.value)));$('#b-height').value=String(Math.round(verticalOffset*1000));targetReadouts();
}
function targetReadouts(){for(const name of ['x','z','height'])$('#b-'+name+'-target').textContent=$('#b-'+name).value;}
function requested(){return {x:Number($('#b-x').value),z:Number($('#b-z').value),h:Number($('#b-height').value)/1000,f:100};}
for(const name of ['x','z','height']){const control=$('#b-'+name);control.addEventListener('input',targetReadouts);control.addEventListener('change',()=>planTo(requested()));}
for(const [id,h]of [['b-top',3],['b-upper',2.2],['b-middle',0],['b-lower',-.8],['b-bottom',-3]])$('#'+id).addEventListener('click',()=>{$('#b-height').value=String(h*1000);$('#b-x').value='700';$('#b-z').value='0';targetReadouts();planTo(requested());});
$('#b-return').addEventListener('click',()=>{$('#b-x').value='700';$('#b-z').value='0';$('#b-height').value=String(Math.round(verticalOffset*1000));targetReadouts();planTo(requested());});
$('#b-pause').addEventListener('click',()=>{paused=!paused;if(!paused){lastTime=performance.now();raf=requestAnimationFrame(tick);}else cancelAnimationFrame(raf);update();});
$('#b-skip').addEventListener('click',()=>{if(!motion)return;assign(motion.path.at(-1));motion=null;paused=false;cancelAnimationFrame(raf);notice='已完成通過幾何檢查的路徑；結構強度及失效保護未驗證。';update();});
for(const e of [ac,extent,people,$('#b-mass')]){
  let previous=e.value;
  e.addEventListener(e===people?'change':'input',()=>{if(((e===people||e===$('#b-mass'))&&(Math.abs(Number(sx.value)-700)>.01||Math.abs(Number(sz.value))>.01))||!poseClear(pose())){e.value=previous;notice='新設定與目前位置不相容；人員／配重資料須先回中後修改。';}else{previous=e.value;notice='設定已更新；質量及配重位置按假設重新計算。';}update();});
}

$('#g3-distance-toggle').addEventListener('click',()=>{showDistances=!showDistances;$('#g3-distance-toggle').textContent=showDistances?'尺寸顯示：開':'尺寸顯示：關';$('#g3-distance-toggle').setAttribute('aria-pressed',String(showDistances));$('#g3-distance-summary').hidden=!showDistances;render();});
themeToggle.addEventListener('click',()=>{chosenTheme=root.dataset.g3Theme!=='dark';applyTheme(chosenTheme);colors();render();});
systemTheme.addEventListener('change',e=>{if(chosenTheme===null){applyTheme(e.matches);colors();render();}});
wall.addEventListener('change',render);
view.addEventListener('change',()=>{[yaw,pitch]={iso:[.47,.34],under:[.47,-.48],front:[0,.05],top:[0,Math.PI/2],side:[Math.PI/2,.18]}[view.value];zoom=1;render();});
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-drag.x)*.008;pitch=Math.max(-.65,Math.min(Math.PI/2,pitch+(e.clientY-drag.y)*.008));drag={x:e.clientX,y:e.clientY};render();});
for(const name of ['pointerup','pointercancel'])canvas.addEventListener(name,()=>{drag=null;});
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.7,Math.min(1.6,zoom*Math.exp(-e.deltaY*.001)));render();},{passive:false});
function resize(){width=Math.max(280,$('#g3-stage').getBoundingClientRect().width);height=width<430?560:700;const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);canvas.style.height=height+'px';ctx.setTransform(dpr,0,0,dpr,0,0);colors();render();}
new ResizeObserver(resize).observe($('#g3-stage'));
new MutationObserver(()=>{colors();render();}).observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&motion){paused=true;cancelAnimationFrame(raf);update();}});
applyTheme(systemTheme.matches);resize();syncTargets();update();

})();</script>
